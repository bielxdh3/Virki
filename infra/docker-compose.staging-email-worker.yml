# Manual, operator-approved *isolated staging* override ONLY. Do not include
# this file in routine production/stage actions. Stage must keep worker OFF.
# The operator must independently prove the dedicated worker role, SMTP relay
# restrictions, test allowlist and quota before any standalone worker start.
services:
  email-worker:
    # Omit from an unqualified staging `docker compose up`. The operator
    # must select this service/profile explicitly after receiving approval.
    profiles: ["staging-email-worker-manual"]
    # Override production's unless-stopped: manual staging sends must not
    # resume after worker failure or a Docker daemon/host restart.
    restart: "no"
    environment:
      DATABASE_URL: ${VIRKI_STAGING_EMAIL_WORKER_DATABASE_URL:?isolated staging email-worker URL and role required}
      VIRKI_EMAIL_WORKER_SCOPED_ROLE: required
