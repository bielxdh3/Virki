# Optional override for Cloudflare-Access-free native ADMIN perimeter.
# Never deploy without an operator-signed client CA, allowlist.conf, and
# independent edge verification. Default production Compose keeps Access on.
services:
  hub:
    environment:
      CLOUDFLARE_ACCESS_JWT_REQUIRED: "false"
      VIRKI_HUB_PERIMETER_MODE: "native"
      VIRKI_NATIVE_EDGE_PROOF_SECRET: ${VIRKI_NATIVE_EDGE_PROOF_SECRET:?VIRKI_NATIVE_EDGE_PROOF_SECRET must be set (>=32 chars)}

  hub-edge:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      hub:
        condition: service_healthy
    environment:
      VIRKI_HUB_HOSTNAME: ${VIRKI_HUB_HOSTNAME:-hub.biel.dev.br}
      VIRKI_NATIVE_EDGE_PROOF_SECRET: ${VIRKI_NATIVE_EDGE_PROOF_SECRET:?VIRKI_NATIVE_EDGE_PROOF_SECRET must be set (>=32 chars)}
    ports:
      - "${NATIVE_EDGE_BIND_IP:-127.0.0.1}:${NATIVE_EDGE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/hub-native-edge.conf:/etc/nginx/templates/default.conf.template:ro
      - ${NATIVE_EDGE_ALLOWLIST_PATH:-./nginx/allowlist.conf.example}:/etc/nginx/conf.d/allowlist.conf:ro
      - ${NATIVE_EDGE_CERTS_DIR:?NATIVE_EDGE_CERTS_DIR must contain server.crt, server.key, operator-ca.crt}:/etc/nginx/certs:ro
