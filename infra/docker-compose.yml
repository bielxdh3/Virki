services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:-https://hub.biel.dev.br}
      NEXT_PUBLIC_INTAKE_URL: ${NEXT_PUBLIC_INTAKE_URL:-}
    ports:
      - "127.0.0.1:${PUBLIC_SITE_PORT:-3000}:3000"
      - "127.0.0.1:${HUB_PORT:-3001}:3001"
    command: npm run dev

  intake:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: development
      INTAKE_PORT: 3002
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-http://127.0.0.1:3000}
      BIELOS_INTAKE_ENABLED: ${BIELOS_INTAKE_ENABLED:-false}
      BIELOS_INTAKE_DATABASE_URL: ${BIELOS_INTAKE_DATABASE_URL:-}
      BIELOS_INTAKE_ABUSE_SECRET: ${BIELOS_INTAKE_ABUSE_SECRET:-}
      BIELOS_EMAIL_OUTBOX_KEY: ${BIELOS_EMAIL_OUTBOX_KEY:-}
    ports:
      - "127.0.0.1:${INTAKE_PORT:-3002}:3002"
    command: npm run dev --workspace @bielos/intake

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bielos}
      POSTGRES_USER: ${POSTGRES_USER:-bielos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in local .env}
    volumes:
      - bielos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bielos_postgres_data:
