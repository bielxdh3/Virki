services:
  public-site:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.biel.dev.br}
    ports:
      - "127.0.0.1:${PUBLIC_SITE_PORT:-3000}:3000"
    command: npm run dev --workspace @bielos/public-site

  hub:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      oidc-issuer:
        condition: service_started
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:-https://hub.biel.dev.br}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.biel.dev.br}
      BIELOS_HUB_HOSTNAME: ${BIELOS_HUB_HOSTNAME:-hub.biel.dev.br}
      BIELOS_PORTAL_HOSTNAME: ${BIELOS_PORTAL_HOSTNAME:-portal.biel.dev.br}
      BIELOS_OIDC_PROXY_URL: http://oidc-issuer:3003
      CLOUDFLARE_ACCESS_JWT_REQUIRED: "false"
      BIELOS_RATE_LIMIT_HASH_SECRET: ${BIELOS_RATE_LIMIT_HASH_SECRET:?BIELOS_RATE_LIMIT_HASH_SECRET must be set in local .env}
      BIELOS_TOTP_ENCRYPTION_KEY: ${BIELOS_TOTP_ENCRYPTION_KEY:?BIELOS_TOTP_ENCRYPTION_KEY must be set in local .env}
      BIELOS_EMAIL_OUTBOX_KEY: ${BIELOS_EMAIL_OUTBOX_KEY:?BIELOS_EMAIL_OUTBOX_KEY must be set in local .env}
      BIELOS_OIDC_ADAPTER_KEY: ${BIELOS_OIDC_ADAPTER_KEY:?BIELOS_OIDC_ADAPTER_KEY must be set in local .env}
    ports:
      - "127.0.0.1:${HUB_PORT:-3001}:3001"
    command: npm run dev --workspace @bielos/hub

  oidc-issuer:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      OIDC_ISSUER_PORT: 3003
      BIELOS_OIDC_ISSUER: ${BIELOS_OIDC_ISSUER:-https://portal.biel.dev.br}
      BIELOS_OIDC_SIGNING_JWKS: ${BIELOS_OIDC_SIGNING_JWKS:?BIELOS_OIDC_SIGNING_JWKS must be set in local .env}
      BIELOS_OIDC_COOKIE_KEY: ${BIELOS_OIDC_COOKIE_KEY:?BIELOS_OIDC_COOKIE_KEY must be set in local .env}
      BIELOS_OIDC_ADAPTER_KEY: ${BIELOS_OIDC_ADAPTER_KEY:?BIELOS_OIDC_ADAPTER_KEY must be set in local .env}
    command: npm run start --workspace @bielos/issuer

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bielos}
      POSTGRES_USER: ${POSTGRES_USER:-bielos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in local .env}
    volumes:
      - bielos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bielos_postgres_data:
