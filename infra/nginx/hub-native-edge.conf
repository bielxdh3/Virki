server {
  listen 443 ssl default_server;
  ssl_protocols TLSv1.3;
  ssl_reject_handshake on;
}

server {
  listen 443 ssl;
  server_name ${VIRKI_HUB_HOSTNAME};

  ssl_protocols TLSv1.3;
  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_client_certificate /etc/nginx/certs/operator-ca.crt;
  ssl_verify_client on;
  ssl_verify_depth 2;

  include /etc/nginx/conf.d/allowlist.conf;

  location / {
    proxy_pass http://hub:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header X-Virki-Native-Edge-Proof "${VIRKI_NATIVE_EDGE_PROOF_SECRET}";
  }
}
