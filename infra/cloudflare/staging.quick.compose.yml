# No-account Quick Tunnel test: one ephemeral trycloudflare.com hostname per mock service.
# It never proves production-style named tunnel ingress compatibility.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    depends_on: [public-site, hub, oidc-issuer]
    command: ["tunnel", "--url", "http://${VIRKI_PR92_QUICK_TARGET:?}:8080"]
    networks: [staging]
