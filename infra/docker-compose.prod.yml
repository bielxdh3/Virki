services:
  public-site:
    image: ${BIELOS_PRODUCTION_IMAGE:?BIELOS_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/apps/public-site/.next/cache:rw,noexec,nosuid,nodev,size=128m
    environment:
      NODE_ENV: production
      BIELOS_PORTAL_URL: ${BIELOS_PORTAL_URL:-}
    ports:
      - "127.0.0.1:${PUBLIC_SITE_PORT:-3000}:3000"
    command: npm run start --workspace @bielos/public-site
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  hub:
    image: ${BIELOS_PRODUCTION_IMAGE:?BIELOS_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/apps/hub/.next/cache:rw,noexec,nosuid,nodev,size=128m
    depends_on:
      postgres:
        condition: service_healthy
      oidc-issuer:
        condition: service_healthy
    env_file:
      - path: ../.env.oidc-data
        required: true
    environment:
      NODE_ENV: production
      BIELOS_HUB_URL: ${BIELOS_HUB_URL:-https://hub.biel.dev.br}
      BIELOS_PORTAL_URL: ${BIELOS_PORTAL_URL:-}
      BIELOS_HUB_HOSTNAME: ${BIELOS_HUB_HOSTNAME:-hub.biel.dev.br}
      BIELOS_PORTAL_HOSTNAME: ${BIELOS_PORTAL_HOSTNAME:-portal.biel.dev.br}
      BIELOS_OIDC_PROXY_URL: http://oidc-issuer:3003
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      BIELOS_RATE_LIMIT_HASH_SECRET: ${BIELOS_RATE_LIMIT_HASH_SECRET:?BIELOS_RATE_LIMIT_HASH_SECRET must be set in local .env}
      BIELOS_AUDIT_HASH_SECRET: ${BIELOS_AUDIT_HASH_SECRET:?BIELOS_AUDIT_HASH_SECRET must be set in local .env}
      BIELOS_CSRF_SIGNING_KEY: ${BIELOS_CSRF_SIGNING_KEY:?BIELOS_CSRF_SIGNING_KEY must be set in local .env}
      BIELOS_CSRF_SIGNING_KEY_PREVIOUS: ${BIELOS_CSRF_SIGNING_KEY_PREVIOUS:-}
      BIELOS_TOTP_ENCRYPTION_KEY: ${BIELOS_TOTP_ENCRYPTION_KEY:?BIELOS_TOTP_ENCRYPTION_KEY must be set in local .env}
      BIELOS_EMAIL_OUTBOX_KEY: ${BIELOS_EMAIL_OUTBOX_KEY:?BIELOS_EMAIL_OUTBOX_KEY must be set in local .env}
      CLOUDFLARE_ACCESS_JWT_REQUIRED: "true"
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:?CLOUDFLARE_ACCESS_AUDIENCE must be set in local .env}
      CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:?CLOUDFLARE_TEAM_DOMAIN must be set in local .env}
    ports:
      - "127.0.0.1:${HUB_PORT:-3001}:3001"
    command: npm run start --workspace @bielos/hub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  oidc-issuer:
    image: ${BIELOS_PRODUCTION_IMAGE:?BIELOS_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env.oidc
        required: true
      - path: ../.env.oidc-data
        required: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      BIELOS_RATE_LIMIT_HASH_SECRET: ${BIELOS_RATE_LIMIT_HASH_SECRET:?BIELOS_RATE_LIMIT_HASH_SECRET must be set in local .env}
      OIDC_ISSUER_PORT: 3003
    command: npm run start --workspace @bielos/issuer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    image: ${BIELOS_MIGRATOR_IMAGE:?BIELOS_MIGRATOR_IMAGE must be set in local .env}
    pull_policy: never
    profiles: ["migration"]
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run prisma:migrate:deploy

  session-cleanup:
    image: ${BIELOS_PRODUCTION_IMAGE:?BIELOS_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-3600}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
    command: ["sh", "-c", "while true; do npm run sessions:cleanup --workspace @bielos/auth && npm run audit:cleanup --workspace @bielos/auth || exit 1; sleep \"$${SESSION_CLEANUP_INTERVAL_SECONDS:-3600}\"; done"]

  email-worker:
    image: ${BIELOS_PRODUCTION_IMAGE:?BIELOS_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      BIELOS_EMAIL_TRANSPORT: ${BIELOS_EMAIL_TRANSPORT:-}
      BIELOS_EMAIL_OUTBOX_KEY: ${BIELOS_EMAIL_OUTBOX_KEY:?BIELOS_EMAIL_OUTBOX_KEY must be set in local .env}
      BIELOS_EMAIL_SMTP_HOST: ${BIELOS_EMAIL_SMTP_HOST:-}
      BIELOS_EMAIL_SMTP_PORT: ${BIELOS_EMAIL_SMTP_PORT:-587}
      BIELOS_EMAIL_SMTP_SECURE: ${BIELOS_EMAIL_SMTP_SECURE:-false}
      BIELOS_EMAIL_SMTP_USER: ${BIELOS_EMAIL_SMTP_USER:-}
      BIELOS_EMAIL_SMTP_PASSWORD: ${BIELOS_EMAIL_SMTP_PASSWORD:-}
      BIELOS_EMAIL_FROM: ${BIELOS_EMAIL_FROM:-}
      BIELOS_EMAIL_REPLY_TO: ${BIELOS_EMAIL_REPLY_TO:-}
    command: npm run email:worker --workspace @bielos/auth

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bielos}
      POSTGRES_USER: ${POSTGRES_USER:-bielos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in local .env}
    volumes:
      - bielos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bielos_postgres_data:
