services:
  public-site:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/apps/public-site/.next/cache:rw,noexec,nosuid,nodev,size=128m
    environment:
      NODE_ENV: production
      VIRKI_PORTAL_URL: ${VIRKI_PORTAL_URL:-}
    ports:
      - "127.0.0.1:${PUBLIC_SITE_PORT:-3000}:3000"
    command: npm run start --workspace @virki/public-site
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  hub:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/apps/hub/.next/cache:rw,noexec,nosuid,nodev,size=128m
    depends_on:
      postgres:
        condition: service_healthy
      oidc-issuer:
        condition: service_healthy
    env_file:
      - path: ../.env.oidc-data
        required: true
    environment:
      NODE_ENV: production
      VIRKI_HUB_URL: ${VIRKI_HUB_URL:-https://hub.biel.dev.br}
      VIRKI_PORTAL_URL: ${VIRKI_PORTAL_URL:-}
      VIRKI_HUB_HOSTNAME: ${VIRKI_HUB_HOSTNAME:-hub.biel.dev.br}
      VIRKI_PORTAL_HOSTNAME: ${VIRKI_PORTAL_HOSTNAME:-portal.biel.dev.br}
      VIRKI_OIDC_PROXY_URL: http://oidc-issuer:3003
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      VIRKI_RATE_LIMIT_HASH_SECRET: ${VIRKI_RATE_LIMIT_HASH_SECRET:?VIRKI_RATE_LIMIT_HASH_SECRET must be set in local .env}
      VIRKI_AUDIT_HASH_SECRET: ${VIRKI_AUDIT_HASH_SECRET:?VIRKI_AUDIT_HASH_SECRET must be set in local .env}
      VIRKI_CSRF_SIGNING_KEY: ${VIRKI_CSRF_SIGNING_KEY:?VIRKI_CSRF_SIGNING_KEY must be set in local .env}
      VIRKI_CSRF_SIGNING_KEY_PREVIOUS: ${VIRKI_CSRF_SIGNING_KEY_PREVIOUS:-}
      VIRKI_TOTP_ENCRYPTION_KEY: ${VIRKI_TOTP_ENCRYPTION_KEY:?VIRKI_TOTP_ENCRYPTION_KEY must be set in local .env}
      VIRKI_EMAIL_OUTBOX_KEY: ${VIRKI_EMAIL_OUTBOX_KEY:?VIRKI_EMAIL_OUTBOX_KEY must be set in local .env}
      CLOUDFLARE_ACCESS_JWT_REQUIRED: "true"
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:?CLOUDFLARE_ACCESS_AUDIENCE must be set in local .env}
      CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:?CLOUDFLARE_TEAM_DOMAIN must be set in local .env}
    ports:
      - "127.0.0.1:${HUB_PORT:-3001}:3001"
    command: npm run start --workspace @virki/hub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  oidc-issuer:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env.oidc
        required: true
      - path: ../.env.oidc-data
        required: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      VIRKI_RATE_LIMIT_HASH_SECRET: ${VIRKI_RATE_LIMIT_HASH_SECRET:?VIRKI_RATE_LIMIT_HASH_SECRET must be set in local .env}
      OIDC_ISSUER_PORT: 3003
    command: npm run start --workspace @virki/issuer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    image: ${VIRKI_MIGRATOR_IMAGE:?VIRKI_MIGRATOR_IMAGE must be set in local .env}
    pull_policy: never
    profiles: ["migration"]
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL must be set in local .env}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run prisma:migrate:deploy

  first-admin-bootstrap:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    profiles: ["bootstrap"]
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      NODE_ENV: production
      VIRKI_FIRST_INSTALL_BOOTSTRAP: ${VIRKI_FIRST_INSTALL_BOOTSTRAP:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      VIRKI_AUDIT_HASH_SECRET: ${VIRKI_AUDIT_HASH_SECRET:?VIRKI_AUDIT_HASH_SECRET must be set in local .env}
    command: npm run bootstrap:first-admin --workspace @virki/auth

  session-cleanup:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-3600}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
    command: ["sh", "-c", "while true; do npm run sessions:cleanup --workspace @virki/auth || exit 1; sleep \"$${SESSION_CLEANUP_INTERVAL_SECONDS:-3600}\"; done"]

  audit-maintenance:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    profiles: ["maintenance"]
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${AUDIT_MAINTENANCE_DATABASE_URL:?AUDIT_MAINTENANCE_DATABASE_URL must be set in local .env}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
    command: npm run audit:cleanup --workspace @virki/auth

  email-worker:
    image: ${VIRKI_PRODUCTION_IMAGE:?VIRKI_PRODUCTION_IMAGE must be set in local .env}
    pull_policy: never
    restart: unless-stopped
    user: node:node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      VIRKI_EMAIL_TRANSPORT: ${VIRKI_EMAIL_TRANSPORT:-}
      VIRKI_EMAIL_OUTBOX_KEY: ${VIRKI_EMAIL_OUTBOX_KEY:?VIRKI_EMAIL_OUTBOX_KEY must be set in local .env}
      VIRKI_EMAIL_SMTP_HOST: ${VIRKI_EMAIL_SMTP_HOST:-}
      VIRKI_EMAIL_SMTP_PORT: ${VIRKI_EMAIL_SMTP_PORT:-587}
      VIRKI_EMAIL_SMTP_SECURE: ${VIRKI_EMAIL_SMTP_SECURE:-false}
      VIRKI_EMAIL_SMTP_USER: ${VIRKI_EMAIL_SMTP_USER:-}
      VIRKI_EMAIL_SMTP_PASSWORD: ${VIRKI_EMAIL_SMTP_PASSWORD:-}
      VIRKI_EMAIL_FROM: ${VIRKI_EMAIL_FROM:-}
      VIRKI_EMAIL_REPLY_TO: ${VIRKI_EMAIL_REPLY_TO:-}
    command: npm run email:worker --workspace @virki/auth

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virki}
      POSTGRES_USER: ${POSTGRES_USER:-virki_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in local .env}
      VIRKI_RUNTIME_DB_PASSWORD: ${VIRKI_RUNTIME_DB_PASSWORD:?VIRKI_RUNTIME_DB_PASSWORD must be set in local .env}
      VIRKI_MIGRATOR_DB_PASSWORD: ${VIRKI_MIGRATOR_DB_PASSWORD:?VIRKI_MIGRATOR_DB_PASSWORD must be set in local .env}
      VIRKI_AUDIT_MAINTENANCE_DB_PASSWORD: ${VIRKI_AUDIT_MAINTENANCE_DB_PASSWORD:?VIRKI_AUDIT_MAINTENANCE_DB_PASSWORD must be set in local .env}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
    volumes:
      - virki_postgres_data:/var/lib/postgresql/data
      - ./postgres-init/10-virki-database-roles.sh:/docker-entrypoint-initdb.d/10-virki-database-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  virki_postgres_data:
