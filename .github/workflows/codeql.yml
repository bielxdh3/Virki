name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "cdx/**"
      - "feat/virki-offline-manual-npm-stage17-20261028"
  schedule:
    - cron: "29 11 * * 1"

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Push and scheduled runs get a per-SHA-and-event group, so a main run is never
  # cancelled or displaced while pending.
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: never

      - name: Enforce reviewed CodeQL SARIF policy
        run: node scripts/codeql-sarif-policy.mjs codeql-results

      # Retain diagnostic SARIF even if the policy rejects it. A failed CodeQL
      # run cannot trigger trusted GHCR publication, regardless of this artifact.
      - name: Preserve SARIF for diagnostics and gated publication
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 2
