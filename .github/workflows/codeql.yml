name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "29 11 * * 1"

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Push and scheduled runs get a per-SHA-and-event group, so a main run is never
  # cancelled or displaced while pending.
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: never

      - name: Enforce reviewed CodeQL SARIF policy
        run: node scripts/codeql-sarif-policy.mjs codeql-results

      - name: Store reviewed CodeQL SARIF in private GHCR evidence
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ github.sha }}
          ACCEPTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(gh api users/bielxdh3/packages/container/virki-evidence --jq .visibility)" = private
          mkdir evidence
          cp codeql-results/*.sarif evidence/
          mkdir -m 700 "$RUNNER_TEMP/ghcr-auth"
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
          ref="ghcr.io/bielxdh3/virki-evidence:$ACCEPTED_SHA-$ACCEPTED_RUN_ID-codeql"
          docker build --build-arg "VIRKI_BUILD_REVISION=$ACCEPTED_SHA" --build-arg "VIRKI_EVIDENCE_RUN_ID=$ACCEPTED_RUN_ID" --build-arg VIRKI_EVIDENCE_KIND=codeql --build-arg VIRKI_EVIDENCE_PLATFORM=none -f infra/Dockerfile.evidence -t "$ref" .
          push_result=$(docker push "$ref")
          digest=$(printf '%s\n' "$push_result" | sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(gh api users/bielxdh3/packages/container/virki-evidence --jq .visibility)" = private
          printf 'VIRKI_EVIDENCE_DIGEST revision=%s run=%s kind=codeql platform=none digest=%s\n' "$ACCEPTED_SHA" "$ACCEPTED_RUN_ID" "$digest"
