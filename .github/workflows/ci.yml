name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "cdx/**"

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Every other run gets a per-SHA group, so no main push (which publishes
  # images and evidence) is ever cancelled or displaced while pending.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  identity:
    name: Verify Virki identity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Reject legacy project identifiers
        run: npm run identity:verify

  tooling-policy:
    name: Audit Prisma tooling policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma dependency tree
        run: |
          node --version
          npm --version
          npm ls @prisma/config deepmerge-ts --all

      - name: Audit Prisma tooling policy
        run: node scripts/tooling-audit-policy.mjs

      - name: Test Prisma tooling policy
        run: node --test scripts/tooling-audit-policy.test.mjs

  production-audit:
    name: Audit production dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install production dependencies only
        run: npm ci --omit=dev --omit=peer --omit=optional --ignore-scripts --no-audit

      - name: Test production dependency audit policy
        run: node --test scripts/production-dependency-audit.test.mjs

      - name: Audit production dependency tree
        run: node scripts/production-dependency-audit.mjs

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secrets:scan

      - name: Production control tests
        run: npm run test:production-revision

      - name: Disposable Cloudflared staging guards
        run: node --test scripts/cloudflared-staging.test.mjs

      - name: Root-protected offline transport test fixtures
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' && github.repository == 'bielxdh3/Virki' }}
        # The normal runner cannot open the fixture's 0700 root-only trust
        # directory. Keep the positive-path tamper tests mandatory under a
        # bounded sudo Node process; no SSH, Docker or deploy commands run.
        run: sudo "$(command -v node)" --test scripts/offline-production-transport.test.mjs

      - name: Disposable Docker safety tests
        run: npm run test:production:docker-safety

      - name: Native root trusted source Git tests
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 0:0 \
            --pids-limit 256 \
            --memory 512m \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace,readonly \
            --tmpfs /var/lib:rw,nosuid,nodev,size=128m,mode=0700 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --env npm_config_cache=/tmp/npm-cache \
            --workdir /workspace \
            node:22.23.3-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8 \
            npm run test:offline:source-git:root

      - name: Disposable offline owner approval and restore rehearsal
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 0:0 \
            --pids-limit 256 \
            --memory 512m \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace,readonly \
            --tmpfs /var/lib:rw,nosuid,nodev,size=128m,mode=0700 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --env npm_config_cache=/tmp/npm-cache \
            --workdir /workspace \
            node:22.23.3-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8 \
            npm run test:offline:rehearsal

      - name: Disposable native offline coordinator fault rehearsal
        run: npm run test:offline:coordinator:container

      - name: Native Linux production operations tests
        run: |
          bash -n scripts/production-server.sh
          node --test scripts/production-ops.test.mjs scripts/production-ci.test.mjs scripts/production-compose.test.mjs scripts/production-image-provenance.test.mjs scripts/ghcr-transport-integration.test.mjs scripts/ghcr-publication.test.mjs scripts/ghcr-evidence.test.mjs

      - name: Verify native machine-id inode race defenses as root
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' && github.repository == 'bielxdh3/Virki' }}
        # This test uses private temporary instrumented module copies; it
        # neither changes /etc/machine-id nor authorizes production admission.
        run: sudo "$(command -v node)" --test infra/offline/trusted-owner-machine-id-race.test.mjs

      - name: Read-only backup inventory tests
        run: npm run test:backup:inventory

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Unit tests
        run: npm run test:unit

      - name: Confidential Node OIDC SDK and RP example tests
        run: npm run test:oidc-node

      - name: Public surface tests
        run: npm run test:public-site

      - name: Validate disposable migration Docker ownership and CI admission
        run: node --test scripts/migration-validation-docker.test.mjs scripts/backup-validation-docker.test.mjs

      - name: Validate clean migration baseline or transition plan
        env:
          # Hosted runner is trusted by CI policy, not attested by Docker info.
          VIRKI_MIGRATION_VALIDATION_LINUX_CI: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' && github.repository == 'bielxdh3/Virki' && '1' || '0' }}
        run: npm run test:migration

      - name: Test isolated PostgreSQL role separation
        env:
          # Hosted runner policy opts in to local disposable Docker only; the
          # runner environment and daemon identity are not cryptographic proof.
          VIRKI_ROLE_FIXTURE_LINUX_CI: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' && github.repository == 'bielxdh3/Virki' && '1' || '0' }}
        run: npm run test:database:roles

      - name: Validate database backup and restore
        env:
          # Workflow-scoped opt-in. These runner contexts restrict intended
          # execution; they are not cryptographic runner/daemon attestation.
          VIRKI_BACKUP_VALIDATION_LINUX_CI: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' && github.repository == 'bielxdh3/Virki' && '1' || '0' }}
        run: npm run test:backup:restore

      - name: Build applications
        run: npm run build

      - name: Build production Docker image
        if: github.event_name == 'pull_request'
        run: docker build --build-arg VIRKI_BUILD_REVISION=${{ github.sha }} --tag virki-production-ci:${{ github.sha }} -f infra/Dockerfile.prod .

      - name: Verify production Docker revision label
        if: github.event_name == 'pull_request'
        run: |
          observed="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' virki-production-ci:${{ github.sha }})"
          if [ "$observed" != "${{ github.sha }}" ]; then
            echo "Production image revision verification failed."
            exit 1
          fi

      - name: Assert production image dependency boundary
        if: github.event_name == 'pull_request'
        env:
          VIRKI_RUNTIME_IMAGE: virki-production-ci:${{ github.sha }}
          VIRKI_BUILD_ARCH: amd64
          VIRKI_BUILD_REVISION: ${{ github.sha }}
        run: node scripts/production-image-assertion.mjs

      - name: Production runtime smoke
        if: github.event_name == 'pull_request'
        env:
          VIRKI_RUNTIME_IMAGE: virki-production-ci:${{ github.sha }}
          VIRKI_BUILD_ARCH: amd64
          VIRKI_BUILD_REVISION: ${{ github.sha }}
        run: npm run test:production:runtime

      - name: Validate production Compose config
        env:
          VIRKI_RATE_LIMIT_HASH_SECRET: replace-with-test-secret
          VIRKI_BUILD_REVISION: 0123456789abcdef0123456789abcdef01234567
          VIRKI_PRODUCTION_IMAGE: virki-production-ci:0123456789abcdef0123456789abcdef01234567
          VIRKI_MIGRATOR_IMAGE: virki-migrator-ci:0123456789abcdef0123456789abcdef01234567
          VIRKI_HUB_URL: https://hub.example.invalid
          VIRKI_PORTAL_URL: https://portal.example.invalid
          CLOUDFLARE_ACCESS_AUDIENCE: ci-test-audience
          CLOUDFLARE_TEAM_DOMAIN: team.example.invalid
          CLOUDFLARE_TUNNEL_TOKEN: placeholder
        run: |
          cp .env.example .env
          touch .env.oidc .env.oidc-data
          docker compose --env-file .env -f infra/docker-compose.prod.yml -f infra/docker-compose.cloudflare.yml config --no-env-resolution --quiet

  production-images:
    name: Build tested production images (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # GHCR publication requires every independent audit to succeed.
    needs: [validate, authenticated-e2e, tooling-policy, production-audit]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native build architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) observed_arch=amd64 ;;
            aarch64|arm64) observed_arch=arm64 ;;
            *) echo "Unsupported production build architecture." >&2; exit 1 ;;
          esac
          test "$observed_arch" = "$EXPECTED_ARCH"

      - name: Build production and migrator images
        run: |
          docker build --build-arg VIRKI_BUILD_REVISION=${{ github.sha }} --target production --tag virki-production-ci:${{ github.sha }} -f infra/Dockerfile.prod .
          docker build --build-arg VIRKI_BUILD_REVISION=${{ github.sha }} --target migrator --tag virki-migrator-ci:${{ github.sha }} -f infra/Dockerfile.prod .

      - name: Verify image revisions and runtime dependency boundary
        env:
          VIRKI_RUNTIME_IMAGE: virki-production-ci:${{ github.sha }}
          VIRKI_BUILD_ARCH: ${{ matrix.arch }}
          VIRKI_BUILD_REVISION: ${{ github.sha }}
        run: |
          runtime_revision="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$VIRKI_RUNTIME_IMAGE")"
          migrator_revision="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "virki-migrator-ci:${{ github.sha }}")"
          test "$runtime_revision" = "${{ github.sha }}"
          test "$migrator_revision" = "${{ github.sha }}"
          node scripts/production-image-assertion.mjs

      - name: Production runtime smoke
        env:
          VIRKI_RUNTIME_IMAGE: virki-production-ci:${{ github.sha }}
          VIRKI_BUILD_ARCH: ${{ matrix.arch }}
          VIRKI_BUILD_REVISION: ${{ github.sha }}
        run: node scripts/production-runtime-smoke.mjs

      - name: Production migrator image smoke
        env:
          VIRKI_MIGRATOR_IMAGE: virki-migrator-ci:${{ github.sha }}
          VIRKI_BUILD_ARCH: ${{ matrix.arch }}
          VIRKI_BUILD_REVISION: ${{ github.sha }}
        run: node scripts/production-migrator-smoke.mjs

      - name: Publish tested private GHCR images and record exact manifest digests
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          ACCEPTED_SHA: ${{ github.sha }}
          ACCEPTED_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refuse first publication or any pre-existing public package until the owner
          # has explicitly provisioned and verified both private GHCR packages.
          for package in virki-runtime virki-migrator; do
            visibility=$(gh api "users/bielxdh3/packages/container/$package" --jq '.visibility')
            test "$visibility" = private
          done
          printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
          runtime=ghcr.io/bielxdh3/virki-runtime
          migrator=ghcr.io/bielxdh3/virki-migrator
          docker tag "virki-production-ci:$ACCEPTED_SHA" "$runtime:$ACCEPTED_SHA-$EXPECTED_ARCH"
          docker tag "virki-migrator-ci:$ACCEPTED_SHA" "$migrator:$ACCEPTED_SHA-$EXPECTED_ARCH"
          runtime_output=$(docker push "$runtime:$ACCEPTED_SHA-$EXPECTED_ARCH")
          migrator_output=$(docker push "$migrator:$ACCEPTED_SHA-$EXPECTED_ARCH")
          runtime_digest=$(printf '%s\n' "$runtime_output" | sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p')
          migrator_digest=$(printf '%s\n' "$migrator_output" | sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p')
          [[ "$runtime_digest" =~ ^sha256:[a-f0-9]{64}$ && "$migrator_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          for package in virki-runtime virki-migrator; do
            visibility=$(gh api "users/bielxdh3/packages/container/$package" --jq '.visibility')
            test "$visibility" = private
          done
          printf 'revision=%s\nrun_id=%s\nplatform=linux/%s\nruntime_digest=%s\nmigrator_digest=%s\n' \
            "$ACCEPTED_SHA" "$ACCEPTED_RUN_ID" "$EXPECTED_ARCH" "$runtime_digest" "$migrator_digest" \
            > "$RUNNER_TEMP/virki-production-images.manifest"

      - name: Store exact-run image digests in private GHCR evidence
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ github.sha }}
          ACCEPTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(gh api users/bielxdh3/packages/container/virki-evidence --jq .visibility)" = private
          mkdir evidence
          cp "$RUNNER_TEMP/virki-production-images.manifest" evidence/
          mkdir -m 700 "$RUNNER_TEMP/ghcr-evidence-auth"
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-evidence-auth"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
          ref="ghcr.io/bielxdh3/virki-evidence:$ACCEPTED_SHA-$ACCEPTED_RUN_ID-images-$EXPECTED_ARCH"
          docker build --build-arg "VIRKI_BUILD_REVISION=$ACCEPTED_SHA" --build-arg "VIRKI_EVIDENCE_RUN_ID=$ACCEPTED_RUN_ID" --build-arg VIRKI_EVIDENCE_KIND=images --build-arg "VIRKI_EVIDENCE_PLATFORM=linux/$EXPECTED_ARCH" -f infra/Dockerfile.evidence -t "$ref" .
          push_result=$(docker push "$ref")
          digest=$(printf '%s\n' "$push_result" | sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(gh api users/bielxdh3/packages/container/virki-evidence --jq .visibility)" = private
          printf 'VIRKI_EVIDENCE_DIGEST revision=%s run=%s kind=images platform=linux/%s digest=%s\n' "$ACCEPTED_SHA" "$ACCEPTED_RUN_ID" "$EXPECTED_ARCH" "$digest"

  authenticated-e2e:
    name: Authenticated browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      VIRKI_CORE_TEST_DATABASE_CONFIRM: disposable
      VIRKI_E2E_ACCESS_DIAGNOSTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - name: Verify Node 22 and npm 10 E2E toolchain
        shell: bash
        run: |
          [[ "$(node -p 'process.versions.node')" == 22.* ]]
          [[ "$(npm --version)" == 10.* ]]

      - name: Install dependencies
        run: npm ci

      - name: Start least-privilege disposable PostgreSQL
        shell: bash
        run: |
          container_name="virki-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bootstrap_password="$(openssl rand -hex 32)"
          runtime_password="$(openssl rand -hex 32)"
          migrator_password="$(openssl rand -hex 32)"
          audit_maintenance_password="$(openssl rand -hex 32)"
          e2e_password="$(openssl rand -hex 32)"
          echo "::add-mask::$bootstrap_password"
          echo "::add-mask::$runtime_password"
          echo "::add-mask::$migrator_password"
          echo "::add-mask::$audit_maintenance_password"
          echo "::add-mask::$e2e_password"
          docker run --detach --rm --name "$container_name" \
            --publish 127.0.0.1::5432 \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=512m \
            --health-cmd 'pg_isready -h 127.0.0.1 -U virki_bootstrap -d virki_e2e_test' \
            --health-interval 1s --health-timeout 3s --health-retries 90 \
            --env POSTGRES_DB=virki_e2e_test \
            --env POSTGRES_USER=virki_bootstrap \
            --env "POSTGRES_PASSWORD=$bootstrap_password" \
            --env "VIRKI_RUNTIME_DB_PASSWORD=$runtime_password" \
            --env "VIRKI_MIGRATOR_DB_PASSWORD=$migrator_password" \
            --env "VIRKI_AUDIT_MAINTENANCE_DB_PASSWORD=$audit_maintenance_password" \
            --volume "$GITHUB_WORKSPACE/infra/postgres-init/10-virki-database-roles.sh:/docker-entrypoint-initdb.d/10-virki-database-roles.sh:ro" \
            --env "VIRKI_E2E_DATABASE_PASSWORD=$e2e_password" \
            --volume "$GITHUB_WORKSPACE/scripts/e2e/20-virki-e2e-runtime-test-role.sh:/docker-entrypoint-initdb.d/20-virki-e2e-runtime-test-role.sh:ro" \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 >/dev/null
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_name" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then echo 'Disposable PostgreSQL initialization failed.' >&2; exit 1; fi
            sleep 1
          done
          if [ "$(docker inspect --format='{{.State.Health.Status}}' "$container_name")" != healthy ]; then
            echo 'Disposable PostgreSQL did not become healthy.' >&2
            exit 1
          fi
          mapped_port="$(docker port "$container_name" 5432/tcp)"
          case "$mapped_port" in 127.0.0.1:*) ;; *) echo 'Disposable PostgreSQL port is not loopback-bound.' >&2; exit 1 ;; esac
          host_port="${mapped_port##*:}"
          database_protocol=postgresql
          runtime_role=virki_runtime
          migrator_role=virki_migrator
          e2e_test_role=virki_runtime_test
          audit_cleanup_role=virki_migrator
          audit_cleanup_url_file="$(mktemp "$RUNNER_TEMP/virki-e2e-audit-cleanup-url.XXXXXX")"
          chmod 600 "$audit_cleanup_url_file"
          printf 'VIRKI_E2E_AUDIT_CLEANUP_URL_FILE=%s\n' "$audit_cleanup_url_file" >> "$GITHUB_ENV"
          printf '%s://%s:%s@127.0.0.1:%s/virki_e2e_test?schema=public' "$database_protocol" "$audit_cleanup_role" "$migrator_password" "$host_port" > "$audit_cleanup_url_file"
          printf 'VIRKI_E2E_DATABASE_URL=%s://%s:%s@127.0.0.1:%s/virki_e2e_test?schema=public\n' "$database_protocol" "$e2e_test_role" "$e2e_password" "$host_port" >> "$GITHUB_ENV"
          printf 'DATABASE_URL=%s://%s:%s@127.0.0.1:%s/virki_e2e_test?schema=public\n' "$database_protocol" "$runtime_role" "$runtime_password" "$host_port" >> "$GITHUB_ENV"
          printf 'MIGRATION_DATABASE_URL=%s://%s:%s@127.0.0.1:%s/virki_e2e_test?schema=public\n' "$database_protocol" "$migrator_role" "$migrator_password" "$host_port" >> "$GITHUB_ENV"

      - name: Install Chromium certificate trust tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Guard disposable E2E database target
        run: npx tsx scripts/e2e/global-setup.mts --validate-database

      - name: Apply committed Prisma migrations to disposable PostgreSQL
        run: npm run prisma:migrate:deploy

      - name: Test first ADMIN against isolated virgin PostgreSQL clone (A02)
        shell: bash
        run: |
          set -euo pipefail
          container_name="virki-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The source has only just been migrated, before any integration/E2E
          # mutations. Never reset a shared database to simulate first install.
          docker exec "$container_name" psql -U virki_bootstrap -d postgres -v ON_ERROR_STOP=1 \
            --command='CREATE DATABASE virki_bootstrap_virgin WITH TEMPLATE virki_e2e_test'
          docker exec "$container_name" psql -U virki_bootstrap -d postgres -v ON_ERROR_STOP=1 \
            --command='REVOKE ALL ON DATABASE virki_bootstrap_virgin FROM PUBLIC; GRANT CONNECT ON DATABASE virki_bootstrap_virgin TO virki_runtime_test;'
          bootstrap_url="${VIRKI_E2E_DATABASE_URL/virki_e2e_test/virki_bootstrap_virgin}"
          test "$bootstrap_url" != "$VIRKI_E2E_DATABASE_URL"
          VIRKI_INTEGRATION_DATABASE_URL="$bootstrap_url" VIRKI_BOOTSTRAP_TEST_DATABASE_CONFIRM=virgin \
            npm run test:integration -- packages/auth/src/bootstrap-first-admin.integration.test.ts

      - name: Database integration tests
        run: |
          VIRKI_INTEGRATION_DATABASE_URL="$VIRKI_E2E_DATABASE_URL" npm run test:integration

      - name: Run browser E2E
        run: |
          cleanup_url="$(cat "$VIRKI_E2E_AUDIT_CLEANUP_URL_FILE")"
          # The next step runs production-mode E2E with this same isolated fixture.
          # Do not delete its root-owned, mode-0600 credential here; the following
          # step deletes it, and the always() cleanup does so on any earlier error.
          trap 'unset cleanup_url' EXIT
          VIRKI_E2E_AUDIT_CLEANUP_DATABASE_URL="$cleanup_url" npm run test:e2e

      - name: Run production Hub core browser E2E
        env:
          VIRKI_E2E_HUB_MODE: production
          VIRKI_HUB_HOSTNAME: hub.localhost
          VIRKI_PORTAL_HOSTNAME: portal.localhost
          VIRKI_HUB_URL: https://hub.localhost
          VIRKI_PORTAL_URL: https://portal.localhost
          VIRKI_OIDC_PROXY_URL: http://127.0.0.1:3003
        run: |
          printf '127.0.0.1 access.e2e.invalid\n' | sudo tee -a /etc/hosts >/dev/null
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0 >/dev/null
          cleanup_url="$(cat "$VIRKI_E2E_AUDIT_CLEANUP_URL_FILE")"
          trap 'unset cleanup_url; rm -f -- "$VIRKI_E2E_AUDIT_CLEANUP_URL_FILE" || true' EXIT
          VIRKI_E2E_AUDIT_CLEANUP_DATABASE_URL="$cleanup_url" npm run test:e2e -- e2e/authenticated-journeys.spec.mts e2e/oidc-authorization-code.spec.mts

      - name: Remove disposable PostgreSQL
        if: always()
        shell: bash
        run: |
          container_name="virki-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id="$(docker ps --all --quiet --filter "name=^/${container_name}$")"
          if [ -n "$container_id" ]; then docker rm --force "$container_id" >/dev/null; fi
          if [ -n "${VIRKI_E2E_AUDIT_CLEANUP_URL_FILE:-}" ]; then rm -f -- "$VIRKI_E2E_AUDIT_CLEANUP_URL_FILE"; fi
