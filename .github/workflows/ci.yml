name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency lockfile
        run: npm audit --package-lock-only --audit-level=moderate

      - name: Secret scan
        run: npm run secrets:scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build
        run: npm run build

      - name: Build production Docker image
        run: docker build -f infra/Dockerfile.prod .

      - name: Validate production Compose config
        env:
          DATABASE_URL: postgresql://bielos_app:local-validation-only@postgres:5432/bielos
          POSTGRES_PASSWORD: local-validation-only
          NEXT_PUBLIC_HUB_URL: https://hub.example.invalid
          CLOUDFLARE_TUNNEL_TOKEN: placeholder
        run: docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.cloudflare.yml config --no-env-resolution --quiet
