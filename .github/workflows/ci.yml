name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependency lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency lockfile
        run: npm audit --package-lock-only --audit-level=moderate

  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bielos_core_test
          POSTGRES_USER: bielos_test
          POSTGRES_PASSWORD: local-validation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bielos_test -d bielos_core_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      CORE_TEST_DATABASE_URL: postgresql://bielos_test:local-validation-only@127.0.0.1:5432/bielos_core_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secrets:scan

      - name: Production revision tests
        run: npm run test:production-revision

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Public site discovery tests
        run: npm run test:public-site

      - name: Core unit tests
        run: npm run test:core:unit

      - name: Core database integration tests
        run: npm run test:core:db:integration

      - name: Intake database role validation
        run: npm run test:intake:db-role

      - name: Backup and restore validation
        run: npm run test:backup:restore

      - name: Core concurrency tests
        run: npm run test:core:concurrency

      - name: Build
        run: npm run build

      - name: Build production Docker image
        run: docker build --build-arg BIELOS_BUILD_REVISION=${{ github.sha }} --tag bielos-production-ci:${{ github.sha }} -f infra/Dockerfile.prod .

      - name: Verify production Docker revision label
        run: |
          observed="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' bielos-production-ci:${{ github.sha }})"
          if [ "$observed" != "${{ github.sha }}" ]; then
            echo "Production image revision verification failed."
            exit 1
          fi

      - name: Validate production Compose config
        env:
          DATABASE_URL: postgresql://bielos_app:local-validation-only@postgres:5432/bielos
          BIELOS_RATE_LIMIT_HASH_SECRET: replace-with-test-secret
          BIELOS_BUILD_REVISION: 0123456789abcdef0123456789abcdef01234567
          POSTGRES_PASSWORD: local-validation-only
          NEXT_PUBLIC_HUB_URL: https://hub.example.invalid
          PUBLIC_SITE_ORIGIN: https://www.example.invalid
          CLOUDFLARE_ACCESS_AUDIENCE: ci-test-audience
          CLOUDFLARE_TEAM_DOMAIN: team.example.invalid
          CLOUDFLARE_TUNNEL_TOKEN: placeholder
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.cloudflare.yml config --no-env-resolution --quiet
